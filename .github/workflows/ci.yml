name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm test

      - name: production build
        run: npm run build

      # Fails the step but not the job — review output and address via PRs (including Dependabot).
      - name: npm audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true
